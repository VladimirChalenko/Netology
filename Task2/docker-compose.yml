version: '3.8'                      # Версия синтаксиса Compose (актуальная стабильная)

services:                           # Секция сервисов (контейнеров)
  web:                              # Имя сервиса (можете переименовать)
    image:                          # Используемый образ
    ports:
      - "80:80"                     # Проброс портов (хост:контейнер)
    volumes:
      - web-data:/usr/share/nginx/html   # Монтируем именованный том в контейнер
    networks:
      - chalenkovv-my-netology-hw   # Подключаем сервис к нашей сети

volumes:                            # Секция именованных томов (для сохранения данных)
  web-data:                         # Объявляем том, который используется выше

networks:                           # Секция сетей
  chalenkovv-my-netology-hw:        # Имя сети 
    driver: bridge                  # Драйвер (bridge — стандартный для изолированных сетей)
    ipam:                           # IP-адресный менеджер
      config:
        - subnet: 10.5.0.0/16       # Заданная подсеть 
